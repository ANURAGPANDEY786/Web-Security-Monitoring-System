
spring.application.name=siem-lite
server.port=${PORT:8081}

# MySQL Database
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/siem_lite_db}
spring.datasource.username=${DB_USERNAME:siem_user}
spring.datasource.password=${DB_PASSWORD:Anurag@123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# OWASP ZAP service
zap.base-url=${ZAP_BASE_URL:http://localhost:8090}
zap.api-key=${ZAP_API_KEY:}

# Security logging
logging.level.org.springframework.security=INFO
zap.base-url=${ZAP_BASE_URL:http://localhost:8090}
zap.api-key=${ZAP_API_KEY:}
