services:
  siem-lite:
    build: .
    container_name: siem-lite
    ports:
      - "8081:8081"

    environment:
      PORT: 8081
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      ZAP_BASE_URL: http://zap:8090
      ZAP_API_KEY: ${ZAP_API_KEY}

    depends_on:
      - zap

    restart: unless-stopped

    networks:
      siem-network:
        ipv4_address: 172.30.0.10

  zap:
    image: ghcr.io/zaproxy/zaproxy:stable
    container_name: siem-zap

    environment:
      ZAP_PORT: 8090

    command:
      - zap.sh
      - -daemon
      - -host
      - 0.0.0.0
      - -port
      - "8090"
      - -config
      - "api.key=${ZAP_API_KEY}"
      - -config
      - "api.addrs.addr.name=.*"
      - -config
      - "api.addrs.addr.regex=true"

    expose:
      - "8090"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8090'"
        ]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 60s

    restart: unless-stopped

    networks:
      siem-network:
        ipv4_address: 172.30.0.20

networks:
  siem-network:
    ipam:
      config:
        - subnet: 172.30.0.0/24